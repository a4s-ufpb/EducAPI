spring:
    datasource:
        driverClassName: org.h2.Driver
        password: ''
        url: jdbc:h2:file:./data
        username: sa
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: true
        show-sql: true
minio:
    url: http://minio:9000
    access-key: ${MINIO_USER}
    secret-key: ${MINIO_PASSWORD}
    bucket: ${MINIO_BUCKET}