spring:
    datasource:
        driver-class-name: org.postgresql.Driver
        password: ${DB_PASSWORD}
        url: ${DB_URL}
        username: ${DB_USER}
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                format_sql: false
        show-sql: false
minio:
   minio:
    url: http://minio:9000
    access-key: ${MINIO_USER}
    secret-key: ${MINIO_PASSWORD}
    bucket: ${MINIO_BUCKET}