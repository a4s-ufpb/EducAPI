services:

    educapi:
        container_name: educapi
        build:
            context: .
        restart: unless-stopped
        ports:
            - "8080:8080"
        depends_on:
            - db
        env_file:
            - .env

    db:
        container_name: postgres-educapi
        image: postgres:12.3
        restart: unless-stopped
        ports:
            - "5432:5432"
        volumes:
            - postgres-educapi:/data/postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            PGDATA: /data/postgres
        env_file:
            - .env

    minio:
        image: minio/minio
        container_name: minio-educapi
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}

        command: server /data --console-address ":9001"
        volumes:
            - minio-data:/data
    minio-init:
        image: minio/mc
        depends_on:
            - minio
        entrypoint: >
            /bin/sh -c "
            sleep 5;
            mc alias set myminio http://minio:9000 minioadmin minioadmin;
            mc mb myminio/educapi-context-images;
            mc anonymous set download myminio/educapi-context-images;
            exit 0;
            "


volumes:
    postgres-educapi:
    minio-data:

